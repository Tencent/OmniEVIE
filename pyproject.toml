[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnievie"
version = "1.0.0"
description = "OmniEVIE-4B: Evidence-Vector-Informed Multi-Vector Retrieval over Text, Image, Document and Video"
readme = "README.md"
license = {file = "LICENSE.txt"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6.0",
    "transformers>=5.13.0",
    "huggingface-hub>=0.25.0",
    "flash-attn>=2.7.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "safetensors>=0.4.5",
    "pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/Tencent/OmniEVIE"
Repository = "https://github.com/Tencent/OmniEVIE"
Model = "https://huggingface.co/tencent/OmniEVIE-4B"

[project.optional-dependencies]
eval = ["pyarrow>=18.0.0"]
test = ["pytest"]

[project.scripts]
omnievie = "omnievie.cli:main"

[tool.setuptools.packages.find]
include = ["omnievie*"]
